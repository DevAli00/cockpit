[alembic]
script_location = alembic
prepend_sys_path = .
# The database URL is read from COCKPIT_DATABASE_URL in alembic/env.py, never stored here.

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
